xit{display:none;position:fixed;right:20px;top:20px;z-index:8}.quiet .exit{display:block}.info{max-width:700px;text-align:left;font:17px/1.8 system-ui,sans-serif}.info h1{font:italic 45px Georgia,serif}.info button{margin:6px}.notice{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#152e3ff0;border-radius:15px;padding:10px 18px;z-index:20;font:13px system-ui,sans-serif;display:none}.notice.show{display:block}@media(max-width:700px){header{padding:16px}.brand{font-size:26px}.brand small{font-size:8px;letter-spacing:.17em;margin-left:0}.date{font-size:10px}.stage{padding:80px 43px 195px;min-height:0}.quote h1{font-size:clamp(28px,7vw,42px);margin:22px 0}.arrow{font-size:20px;padding:8px 10px}.prev{left:3px}.next{right:3px}.bottom{bottom:8px;width:calc(100% - 12px);padding:4px}.nav{font-size:10px;padding:11px 4px}.panel{top:78px;bottom:80px;right:9px;max-height:calc(100dvh - 165px)}.actions{bottom:85px;gap:6px}.actions .glass{padding:9px 12px}.actions .glass{font-size:12px}}

const $=id=>document.getElementById(id);const themes=['Inspiring','Encouraging','Thoughtful','Challenging','Comforting','Joyful','Celebrative','Grateful','Compassionate','Hopeful','Wonder','Wisdom'];const icons=['⛰','🌱','📖','🧭','♡','☀','✦','❧','♥','🌅','✧','◈'];let meditations=[],current=null,mode='today',filtered=[],randomSeen=new Set(),favorites=new Set();const store={read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};favorites=new Set(store.read('dm-favorites',[]));const today=new Date(),year=today.getFullYear(),leap=y=>y%4===0&&(y%100!==0||y%400===0),day=Math.floor((Date.UTC(year,today.getMonth(),today.getDate())-Date.UTC(year,0,1))/86400000);$('date').textContent=today.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · Day '+(day+1)+' of '+(leap(year)?366:365);$('date').title='Day of the calendar year; the collection contains 366 meditations';function rng(seed){let a=seed|0;return()=>{a+=0x6d2b79f5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function sequence(){let a=meditations.slice(),r=rng(year*971+366);for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let annual=[];function toast(t){$('notice').textContent=t;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function closePanel(){$('panel').classList.remove('open')}function openPanel(){$('panel').classList.add('open')}function nav(n){mode=n;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('selected',b.dataset.nav===n))}function show(m){if(!m)return;current=m;$('landscape').style.backgroundImage=`url('scenes/${String(m.scene).padStart(3,'0')}.jpg')`;const author=m.author?`<div class="attribution">— ${escapeHTML(m.author)}</div>`:'';$('quote').innerHTML=`<div class="eyebrow">${escapeHTML(m.theme)}</div><h1>${escapeHTML(m.text)}</h1><div class="rule"></div>${author}<div class="actions"><button class="glass" id="fav">${favorites.has(m.id)?'♥ Saved':'♡ Favorite'}</button><button class="glass" id="share">↗ Share</button><button class="glass" id="quiet">⛶ Quiet Mode</button></div>`;$('fav').onclick=()=>{if(favorites.has(m.id))favorites.delete(m.id);else favorites.add(m.id);store.write('dm-favorites',[...favorites]);show(m);toast(favorites.has(m.id)?'Added to favorites':'Removed from favorites')};$('share').onclick=async()=>{const text=m.text+(m.author?' — '+m.author:'')+'\nQuiet Place: Daily Meditations';try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Meditation copied')}else prompt('Copy meditation',text)}catch(e){if(e.name!=='AbortError')toast('Sharing unavailable')}};$('quiet').onclick=()=>{closePanel();document.body.classList.add('quiet')}}function listResults(list,title){$('panelTitle').textContent=title;$('panelContent').replaceChildren();if(!list.length){$('panelContent').innerHTML='<p class="muted">No meditations found.</p>';return}list.forEach(m=>{let b=document.createElement('button');b.className='result';let sm=document.createElement('small');sm.textContent=m.theme;b.append(sm,document.createTextNode(m.text));b.onclick=()=>{show(m);filtered=list;closePanel()};$('panelContent').append(b)})}function themesPanel(){$('panelTitle').textContent='Explore by theme';$('search').value='';$('panelContent').replaceChildren();themes.forEach((t,i)=>{let b=document.createElement('button');b.className='theme';let ic=document.createElement('span');ic.textContent=icons[i];b.append(ic,document.createTextNode(t));b.onclick=()=>{filtered=meditations.filter(m=>m.theme===t);show(filtered[0]);closePanel();toast(t+' · '+filtered.length+' meditations')};$('panelContent').append(b)})}function pickRandom(){let pool=meditations.filter(m=>!randomSeen.has(m.id));if(!pool.length){randomSeen.clear();pool=meditations}let m=pool[Math.floor(Math.random()*pool.length)];randomSeen.add(m.id);return m}function setNav(n){nav(n);if(n==='today'){filtered=annual;show(annual[day%366]);closePanel()}else if(n==='random'){filtered=[];show(pickRandom());closePanel()}else if(n==='themes'){themesPanel();openPanel()}else if(n==='favorites'){filtered=meditations.filter(m=>favorites.has(m.id));listResults(filtered,'Favorites');openPanel()}else{closePanel();$('quote').innerHTML='<div class="info"><div class="eyebrow">About the collection</div><h1>A little room to breathe.</h1><p>366 moments of reflection across twelve themes, inviting gratitude, courage, compassion, wonder, trust, surrender and delight. Faith here is openness to the grounding mystery of existence, not a prescribed religious tradition.</p><p>Each date has a consistent meditation for everyone during the same year. In a common year, February 29’s selection remains available through browsing and Random. All meditations and scene images are packaged for offline reading.</p><p>Your favorites stay on this device. No account is needed.</p><button class="glass" id="export">Export favorites</button><button class="glass" id="import">Restore favorites</button><input type="file" accept="application/json" id="file" hidden><p class="muted">The landscapes in this collection feature Yosemite-area photographs provided for this collection. Forty photographs are thoughtfully rotated across the twelve themes.</p></div>';$('export').onclick=()=>{let b=new Blob([JSON.stringify({version:1,favorites:[...favorites]},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daily-meditations-favorites.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.favorites))throw Error();favorites=new Set(v.favorites.filter(x=>Number.isInteger(x)&&x>=1&&x<=366));store.write('dm-favorites',[...favorites]);toast('Favorites restored')}catch{toast('Could not restore this file')}}}}$('close').onclick=closePanel;$('exit').onclick=()=>document.body.classList.remove('quiet');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('prev').onclick=()=>{let list=filtered.length?filtered:annual;let i=list.findIndex(x=>x.id===current?.id);show(list[(i-1+list.length)%list.length])};$('next').onclick=()=>{let list=filtered.length?filtered:annual;let i=list.findIndex(x=>x.id===current?.id);show(list[(i+1)%list.length])};$('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){themesPanel();return}filtered=meditations.filter(m=>(m.text+' '+m.theme+' '+m.author).toLowerCase().includes(q));listResults(filtered,'Search results')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();document.body.classList.remove('quiet')}if(e.key==='ArrowRight'&&!$('panel').classList.contains('open'))$('next').click();if(e.key==='ArrowLeft'&&!$('panel').classList.contains('open'))$('prev').click()});document.addEventListener('pointerdown',e=>{if($('panel').classList.contains('open')&&!$('panel').contains(e.target)&&!e.target.closest('[data-nav="themes"]')&&!e.target.closest('[data-nav="favorites"]'))closePanel()});fetch('./meditations.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{meditations=data;annual=sequence();filtered=annual;show(annual[day%366]);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}).catch(()=>{$('quote').innerHTML='<p>Unable to load meditations. Please run this app from a web server or GitHub Pages.</p>'});
